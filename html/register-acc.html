<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <script src="../tailwind/tailwind.js"></script>
    <title>Register</title>
</head>
<body>
    <main class="main" style="height: 100vh;">
        <div class="container main-container">
            <div class="acc-box">
                <div class="acc-t-r">
                    <h1 class="acc-title">Register</h1>
                    <p class="acc-text">Already have account? <a href="login-acc.html" class="acc-a">Log In</a></p>
                </div>
                <div class="acc-btn-box">
                    <div class="name-box flex items-center justify-between w-[80%]">
                        <input type="text" class="n-inp a-btn" placeholder="First Name">
                        <input type="text" class="n-inp a-btn" placeholder="Last Name">
                    </div>
                    <input type="text" class="pl-2.5 a-btn" placeholder="dd.nn.yyyy">
                    <div class="gender-box flex items-center justify-between w-[80%]">
                        <div class="g-box n-inp a-btn">
                            <input type="radio" name="gender" class="r" placeholder="Male">
                            <p class="acc-text">Male</p>
                        </div>
                        <div class="g-box n-inp a-btn">
                            <input type="radio" name="gender" class="r" placeholder="Female">
                            <p class="acc-text">Female</p>
                        </div>
                    </div>
                    <input type="email" class="a-btn pl-2.5" placeholder="Enter Your E-Mail">
                    <a href="../index.html" class="a-btn">Submit</a>
                    <a class="back-btn a-btn" href="account.html">Back</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
